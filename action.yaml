name: Release Bump
description: Create the next vX.Y.Z GitHub release with auto-generated notes, optionally moving the floating major tag
author: dvystrcil

inputs:
  token:
    description: "GitHub token with `contents: write` (typically from actions/create-github-app-token)"
    required: true
  initial-version:
    description: Default tag when no previous release exists
    required: false
    default: v0.0.0
  bump:
    description: "patch, minor or major. Default patch, which is what every v0.1.x consumer already gets"
    required: false
    default: patch
  move-major-tag:
    description: "true: point the floating v<MAJOR> tag (e.g. v1) at the release commit, creating it if absent. For action repos whose consumers pin @v1. A major bump creates v2 and leaves v1 alone"
    required: false
    default: "false"
  target:
    description: Commit SHA to release. Defaults to the workflow's commit
    required: false
    default: ""

outputs:
  tag:
    description: The release tag created, e.g. v1.2.3
    value: ${{ steps.release.outputs.tag }}
  major-tag:
    description: The floating tag moved, e.g. v1 (empty unless move-major-tag)
    value: ${{ steps.release.outputs.major-tag }}

runs:
  using: composite
  steps:
    - name: Create GitHub release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INITIAL_VERSION: ${{ inputs.initial-version }}
        BUMP: ${{ inputs.bump }}
        MOVE_MAJOR_TAG: ${{ inputs.move-major-tag }}
        TARGET_SHA: ${{ inputs.target }}
        REPO: ${{ github.repository }}
      run: ${{ github.action_path }}/release.sh
