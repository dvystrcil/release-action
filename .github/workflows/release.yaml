# Release release-action itself -- by its own code on this commit (`uses: ./`),
# so every release is also the end-to-end test of the API paths that
# tests/test-release.sh deliberately does not mock.
#
# Manual on purpose: consumers pin exact tags (@v0.1.1, see README "Version
# policy"), so a release changes nothing until a consumer bumps -- but the
# version number is still a decision, not a side effect of merging.
#   gh workflow run release.yaml --repo dvystrcil/release-action -f bump=minor

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor or major
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: release-action-runner
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: ./
        with:
          token: ${{ github.token }}
          bump: ${{ inputs.bump }}
      - run: echo "released ${{ steps.release.outputs.tag }}"
