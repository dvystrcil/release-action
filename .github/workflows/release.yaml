# Release release-action itself -- by its own code on this commit (`uses: ./`),
# so every release is also the end-to-end test of the API paths that
# tests/test-release.sh deliberately does not mock.
#
# Manual on purpose: consumers pin the floating major tag (@v1, see README
# "Version policy"), and every release moves it. A release therefore ships
# to every consumer at once, so it is a decision, not a side effect of merging.
#   gh workflow run release.yaml --repo dvystrcil/release-action -f bump=minor
# Rollback: point v1 back at the previous release (git push -f origin <sha>:refs/tags/v1).

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch, minor or major
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: release-action-runner
    steps:
      - uses: actions/checkout@v7
      - id: release
        uses: ./
        with:
          token: ${{ github.token }}
          bump: ${{ inputs.bump }}
          move-major-tag: true
      - run: echo "released ${{ steps.release.outputs.tag }}"
