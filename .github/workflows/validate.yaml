# Validate this composite action's manifest on every PR + push to main.
#
# The lint catches the bug class that broke v0.1.0: colon-space inside an
# unquoted YAML string. `Mapping values are not allowed in this context`
# at action-load time is the GHA runner's only signal, and by then a
# downstream consumer's CI has already failed.
#
# Runner: ubuntu-latest. These jobs need no secrets and no cluster access,
# so PR code from anyone runs on GitHub-hosted runners, not the in-cluster
# ARC runner (homelab#2377).

name: validate

on:
  pull_request:
    paths:
      - action.yaml
      - release.sh
      - deploy.py
      - tests/**
      - .github/workflows/validate.yaml
  push:
    branches: [main]
    paths:
      - action.yaml
      - release.sh
      - deploy.py
      - tests/**
      - .github/workflows/validate.yaml

jobs:
  yaml-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        # setup-python pins the interpreter; pyyaml is installed below.
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: |
          # Retried in fresh processes: a bad PyPI edge node once served 502s
          # (homelab#1029, seen from the cluster), and pip's own retries reuse
          # the connection. A new process re-resolves to another node.
          for attempt in 1 2 3; do
            pip install --quiet pyyaml && break
            [ "$attempt" = 3 ] && { echo "::error::pip install failed three times"; exit 1; }
            echo "::warning::pip install failed (attempt ${attempt}/3) — retrying"
            sleep $((attempt * 10))
          done
      - name: Parse action.yaml
        run: |
          python -c "
          import sys, yaml
          try:
              manifest = yaml.safe_load(open('action.yaml'))
          except yaml.YAMLError as exc:
              print(f'::error file=action.yaml::YAML parse failure: {exc}')
              sys.exit(1)
          # Sanity: required GHA composite-action keys.
          for key in ('name', 'description', 'runs'):
              if key not in manifest:
                  print(f'::error file=action.yaml::missing required key: {key}')
                  sys.exit(1)
          if manifest['runs'].get('using') != 'composite':
              print('::error file=action.yaml::runs.using must be \"composite\"')
              sys.exit(1)
          print('action.yaml parses cleanly')
          print(f'  name: {manifest[\"name\"]}')
          print(f'  inputs: {list(manifest.get(\"inputs\", {}).keys())}')
          print(f'  steps: {len(manifest[\"runs\"][\"steps\"])}')
          "

  unit:
    # release.sh's version math and refusals (tests/test-release.sh).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: tests/test-release.sh | tee out.txt
      - run: grep -q '^TEST-RELEASE-COMPLETE$' out.txt

  deploy:
    # deploy.py's guards (tests/test_deploy.py): real git against a bare
    # repo standing in for the deploy repo; only kubectl and gh are stubbed.
    # Stdlib only, so the runner's python3 needs no pip.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v 2>&1 | tee out.txt
      # The pipe hides unittest's exit code; the summary line is the marker.
      - run: grep -qx 'OK' out.txt
